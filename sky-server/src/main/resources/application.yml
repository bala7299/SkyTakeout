server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  ai:
    openai:
      api-key: ${sky.ai.openai.deepseek-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3

  data:
    redis:
      host: ${sky.redis.host}
      password: ${sky.redis.password}
      database: ${sky.redis.datebase}
      port: ${sky.redis.port}
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info
sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 720000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 用户端jwt密钥设置
    user-secret-key: itbala
    user-ttl: 720000000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  baidu:
    ak: ${sky.baidu.ak}
  shop:
    address: ${sky.shop.address}

  comment:
    # 本地 Python AI 润色服务地址（GET ?content= 原始评论）
    ai-optimize-url: http://localhost:8000/ai-optimize

  report:
    # 本地 Python AI 经营诊断报表（POST JSON：差评正文列表）
    ai-report-url: http://localhost:8000/ai-report

